# https://www.getzola.org/documentation/getting-started/configuration/

# Served by GitHub Pages from the rust-lang/lang-research repository. A
# subdomain may come later; everything uses base_url, so only this line changes.
base_url = "https://rust-lang.github.io/lang-research"
compile_sass = true
generate_feeds = true
feed_filenames = ["feed.xml", "posts.json"]
build_search_index = false
skip_content_templating = ["**"]
taxonomies = [{ name = "tags", feed = true }]

[markdown]
bottom_footnotes = true
insert_anchor_links = "left"

[markdown.highlighting]
light_theme = "night-owl-light"
dark_theme = "dark-plus"
style = "class"
extra_themes = ["night-owl-light.json"]

# Put all your custom variables here
[extra]
# Shown at the top of every post unless the post sets `extra.audience_banner = false`.
audience_banner = """
This is a research note by a member of the Rust Project, written for other \
Project members. It reflects the author's thinking at a point in time and is \
not a decision or plan of the Rust Project."""
# Labels for tags, rendered on the /tags page.
# If a label is missing for a tag, the tag will be rendered directly
tag_labels = {}

{% component nav(section, @config) -%}
<nav class="flex flex-row justify-center justify-end-l items-center flex-wrap ph2 pl3-ns pr4-ns">
  <div class="brand flex-auto w-100 w-auto-l self-start tc tl-l">
    <a href="{{ config.base_url | safe }}{{ section.path | safe }}">
      <img class="v-mid ml0-l rust-logo" alt="" src="{{ config.base_url | safe }}/images/rust-logo-blk.svg">
      <span class="dib ml1 ml0-l wordmark">Rust <span class="wordmark-accent">Lang Research</span></span>
    </a>
  </div>

  <ul class="nav list w-100 w-auto-l flex flex-none flex-row flex-wrap justify-center justify-end-l items-center pv2 ph0 ph4-ns">
    <li class="tc pv2 ph2 ph4-ns flex-20-s"><a href="{{ config.base_url | safe }}/">Posts</a></li>
    <li class="tc pv2 ph2 ph4-ns flex-20-s"><a href="{{ config.base_url | safe }}/projects/">Projects</a></li>
    <li class="tc pv2 ph2 ph4-ns flex-20-s"><a href="https://lang-team.rust-lang.org/">Lang team</a></li>
    <li class="tc pv2 ph2 ph4-ns flex-20-s"><a href="https://github.com/rust-lang/lang-research#writing-a-post">Write a post</a></li>
    <button class="theme-icon" onclick="dropdown();">🖌
      <ul id="theme-choice">
        <li class="theme-item" onclick="changeThemeTo('light');">Light</li>
        <li class="theme-item" onclick="changeThemeTo('dark');">Dark</li>
        <li class="theme-item" onclick="changeThemeTo('system');">System</li>
      </ul>
    </button>
    <script src="{{ config.base_url | safe }}/scripts/theme-switch-post.js"></script>
  </ul>
</nav>
{%- endcomponent nav %}
